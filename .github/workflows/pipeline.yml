name: Divo Pipeline

on:
  pull_request:
    branches: [ "dev", "release" ]

jobs:
  build_debug:
    name: Build Debug (MR to dev)
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > TMessagesProj_App/google-services.json

      - name: Build Debug APK
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Upload Debug APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divo-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/Divo-Global.apk

      - name: Extract App Version
        id: extract_version
        run: |
          APP_VERSION=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Send Debug APK to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🛠 **Divo Global (Debug PR)**
            Версия: ${{ env.APP_VERSION }} (Билд #${{ github.run_number }})
            PR из: ${{ github.head_ref }} -> dev
            
            📥 **Скачать APK (Artifacts):**
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  build_release:
    name: Build Release (MR to release)
    if: github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > TMessagesProj_App/google-services.json

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj_App/release.keystore

      - name: Build Release APK and AAB
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease :TMessagesProj_App:bundleAfatRelease

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divo-release-artifacts
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/Divo-Global.apk
            TMessagesProj_App/build/outputs/bundle/afatRelease/*.aab

      - name: Extract App Version
        id: extract_version_release
        run: |
          APP_VERSION=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Send Release info to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔍 **Divo Global (Release PR)**
            Версия: ${{ env.APP_VERSION }} (Билд #${{ github.run_number }})
            PR из: ${{ github.head_ref }} -> release
            
            📥 **Скачать APK и AAB (Artifacts):**
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
