name: Divo Publish Flow

on:
  push:
    branches: [ "dev", "release/*", "master" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > TMessagesProj_App/google-services.json

      - name: Extract App Version
        id: extract_version
        run: |
          APP_VERSION=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v${APP_VERSION}-b${{ github.run_number }}" >> $GITHUB_ENV

      # ==========================================
      # DEV BRANCH (Internal Testing)
      # ==========================================
      - name: Build Debug APK
        if: github.ref == 'refs/heads/dev'
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Create Git Tag (Debug)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag ${{ env.TAG_NAME }}-debug
          git push origin ${{ env.TAG_NAME }}-debug

      - name: Upload Debug APK to GitHub Artifacts
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: divo-debug-apk-${{ env.TAG_NAME }}
          path: TMessagesProj_App/build/outputs/apk/afat/debug/Divo-Global.apk

      - name: Send Debug APK to Telegram
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🛠 **Divo Global (Nightly Debug)**
            Версия: ${{ env.APP_VERSION }} (Билд #${{ github.run_number }})
            Тег: ${{ env.TAG_NAME }}-debug
            Ветка: dev
            
            📥 **Скачать APK (Artifacts):**
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ==========================================
      # RELEASE BRANCH (Release Candidate)
      # ==========================================
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj_App/release.keystore

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease

      - name: Create Git Tag (RC)
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag ${{ env.TAG_NAME }}-rc
          git push origin ${{ env.TAG_NAME }}-rc

      - name: Upload RC APK to GitHub Artifacts
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: divo-rc-apk-${{ env.TAG_NAME }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/Divo-Global.apk

      - name: Send RC APK to Telegram
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔍 **Divo Global (Release Candidate)**
            Версия: ${{ env.APP_VERSION }} (Билд #${{ github.run_number }})
            Тег: ${{ env.TAG_NAME }}-rc
            Ветка: release
            
            📥 **Скачать APK (Artifacts) для тестирования:**
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ==========================================
      # MASTER BRANCH (Production)
      # ==========================================
      - name: Build Release APK and AAB
        if: github.ref == 'refs/heads/master'
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease :TMessagesProj_App:bundleAfatRelease

      - name: Create Git Tag (Release)
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag ${{ env.TAG_NAME }}-release
          git push origin ${{ env.TAG_NAME }}-release

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}-release
          name: Release ${{ env.TAG_NAME }}
          files: |
            TMessagesProj_App/build/outputs/apk/afat/release/Divo-Global.apk
            TMessagesProj_App/build/outputs/bundle/afatRelease/*.aab
          prerelease: false

      - name: Send Release APK to Telegram
        if: github.ref == 'refs/heads/master'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Divo Global (Production Release)**
            Версия: ${{ env.APP_VERSION }} (Билд #${{ github.run_number }})
            Тег: ${{ env.TAG_NAME }}-release
            Ветка: master
            
            📥 **Скачать APK и AAB (GitHub Releases):**
            https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}-release
