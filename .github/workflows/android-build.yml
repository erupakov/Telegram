name: Divo CI Build

on:
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > TMessagesProj_App/google-services.json

      # ==========================================
      # DEBUG
      # ==========================================
      - name: Build Debug APK
        if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: ./gradlew assembleAfatDebug

      - name: Upload Debug APK to Firebase
        if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: TMessagesProj_App/build/outputs/apk/afat/debug/Divo-Global.apk

      # ==========================================
      # RELEASE
      # ==========================================
      - name: Decode Keystore
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj_App/release.keystore

      - name: Build Release APK and AAB
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleAfatRelease bundleAfatRelease

      - name: Upload Release AAB to Artifacts
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: TMessagesProj_App/build/outputs/bundle/afatRelease/*.aab

      - name: Upload Release APK to Firebase
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: TMessagesProj_App/build/outputs/apk/afat/release/Divo-Global.apk
